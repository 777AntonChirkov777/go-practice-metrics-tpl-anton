services:
  postgres:
    image: postgres:16
    container_name: metrics-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: praktikum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d praktikum"]
      interval: 5s
      timeout: 5s
      retries: 5
