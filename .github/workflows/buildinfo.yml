name: build info

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  buildinfo:
    runs-on: ubuntu-latest
    container: golang:1.26

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test build info
        run: |
          go test -race -count=1 ./internal/buildinfo/... ./cmd/server/... ./cmd/agent/...
