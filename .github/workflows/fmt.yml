name: format check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    container: golang:1.26

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.52.0

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted by gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check goimports
        run: |
          unformatted="$(goimports -local practice -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted by goimports -local practice:"
            echo "$unformatted"
            exit 1
          fi
