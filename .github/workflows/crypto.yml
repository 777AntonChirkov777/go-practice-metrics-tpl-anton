name: crypto

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  crypto:
    runs-on: ubuntu-latest
    container: golang:1.26

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test encryption
        run: |
          go test -race -count=1 ./internal/encryption/... ./internal/agent/... ./internal/server/... ./internal/config/...
